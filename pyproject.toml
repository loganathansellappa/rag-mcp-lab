[build]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-mcp"
version = "1.0.0"
description = "RAG MCP service: semantic search and answer generation over a document knowledge base"
requires-python = ">=3.11"
authors = [
    {name = "LoganathanSellappa"}
]
license = {text = "MIT"}

dependencies = [
    "mcp>=0.1.0",
    "numpy>=1.24.0",
    "fastembed>=0.2.5",
    "litellm>=1.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pylint>=2.0.0"
]

[project.scripts]
rag-mcp = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=html"
