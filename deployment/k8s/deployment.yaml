apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-mcp
  namespace: default
  labels:
    app: rag-mcp
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-mcp
  template:
    metadata:
      labels:
        app: rag-mcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: rag-mcp

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - rag-mcp
              topologyKey: kubernetes.io/hostname

      containers:
      - name: rag-mcp
        # Replace with your registry, for example ghcr.io/<owner>/rag-mcp:1.0.0
        image: rag-mcp:1.0.0
        imagePullPolicy: IfNotPresent

        ports:
        - name: mcp
          containerPort: 8000
          protocol: TCP

        env:
        - name: RAG_ENVIRONMENT
          value: "production"
        - name: RAG_LOG_LEVEL
          value: "INFO"
        - name: LITELLM_KEY
          valueFrom:
            secretKeyRef:
              name: rag-secrets
              key: litellm-key
        - name: RAG_KB_PATH
          value: "/data/knowledge_base.json"

        volumeMounts:
        - name: kb-data
          mountPath: /data
          readOnly: true
        - name: logs
          mountPath: /app/logs

        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

      volumes:
      - name: kb-data
        configMap:
          name: rag-kb-data
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: rag-mcp
  namespace: default
  labels:
    app: rag-mcp
spec:
  type: ClusterIP
  ports:
  - name: mcp
    port: 8000
    targetPort: mcp
    protocol: TCP
  selector:
    app: rag-mcp

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-mcp
  namespace: default
